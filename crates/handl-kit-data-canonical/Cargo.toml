[package]
name = "handl-kit-data-canonical"
version.workspace = true
edition.workspace = true
description = "The **data-driven canonical kit** — the ADR-0044 §6 end state."
license.workspace = true
repository.workspace = true

# ADR-0128 Phase 11: this crate moved out of the platform workspace; its
# platform dependencies are git deps (see the workspace root for the
# sibling-checkout `[patch]` override used for local development).
[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
hnl-engine-transform = { git = "https://github.com/handl-lang/engine-transform", branch = "main" }
handl-plugin-ext-diag = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-kit-data = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-runtime = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_yaml = "0.9"
# Serialized `Language` snapshot cache (see `language_from_yaml`).
serde_json = "1"

[dev-dependencies]
hnl-engine-lex-pattern = { git = "https://github.com/handl-lang/engine-lex-pattern", branch = "main" }
hnl-engine-parse-pratt = { git = "https://github.com/handl-lang/engine-parse-pratt", branch = "main" }
hnl-engine-exec-tree-walk = { git = "https://github.com/handl-lang/engine-exec-tree-walk", branch = "main" }
hnl-engine-exec-bytecode = { git = "https://github.com/handl-lang/engine-exec-bytecode", branch = "main" }
hnl-engine-exec-cranelift = { git = "https://github.com/handl-lang/engine-exec-cranelift", branch = "main" }
hnl-engine-transform-rewrite = { git = "https://github.com/handl-lang/engine-transform-rewrite", branch = "main" }