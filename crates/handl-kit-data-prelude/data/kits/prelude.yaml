# The canonical language kit.
#
# Loaded by `handl_kit_data_prelude::manifest()`: no fragment sources — the
# canonical `Language` enters `DataKit::assemble` directly as `base_language`
# (see `assemble()`). Runtime engine selection only.
# No library modules — the canonical kit is the language only.
fragments: []
runtime:
  lex: data
  parse: pratt
  eval: tree-walk
  typecheck: nbe
modules: []

# The base module set the kit registry builds (module-level names;
# dispatch kind per name is a substrate concern — table/custom/native).
base_modules:
  - bool
  - math
  - prim
  - cmp
  - mood
  - bytes
  - obj
  - error
  - typeof
  - option
  - result
  - combinators
  - parse
  - encoding
  - serialize
  - json
  - base64
  - hex
  - tar
  - url_rfc
  - kv_map
  - otlp
  - otlp_c
  - toml_c
  - yaml_c
  - url_whatwg
  - entropy
  - crypto
  - intl_c
  - unicode_c
  - ucol
  - unum
  - upluralrules
  - ureldatefmt
  - udat
  - ufieldpositer
  - unumberformatter
  - uformattednumber
